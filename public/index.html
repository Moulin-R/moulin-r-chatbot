const shuffleArray = (arr) => {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
};

const pickQuestions = (usedSet, count = 6) => {
  const available = ALL_QUESTIONS.filter((q) => !usedSet.has(q));
  if (available.length <= count) return shuffleArray(available);
  return shuffleArray(available).slice(0, count);
};

      : "はじめまして、ムーランRの美容カウンセラー Rena（レナ）です✨\n\nお髪のこと、頭皮のこと、美容のこと…なんでもお気軽にご相談くださいね。\n\n最近、気になっていることはありますか？";
    setMessages([{ role: "assistant", content: greeting }]);
    setShowForm(false);
  };

  const buildSystemPrompt = () => {
    const ageNote = guestAge ? `\n\n【ゲスト情報】現在のゲストは${guestAge}です。年代に合わせたアドバイスや提案を心がけてください。` : "";

      const lastBot = botBubbles[botBubbles.length - 1];
      if (lastBot) {
        lastBot.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }, [messages]);

  const sendMessage = async (text) => {
    if (!text.trim() || isLoading) return;
    setShowQuickQ(false);
    const trimmed = text.trim();

    const newUsed = new Set(usedQuestions);
    newUsed.add(trimmed);
    setUsedQuestions(newUsed);

    const userMsg = { role: "user", content: trimmed };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput("");
    setIsLoading(true);

    try {
      const apiMessages = newMessages
        .filter((m) => m.role !== "system")
        .map((m) => ({
          role: m.role,
          content: m.content,
        }));

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-haiku-5-5",
          max_tokens: 1000,
          system: buildSystemPrompt(),
          messages: apiMessages,
        }),
      });
      const data = await res.json();
      const reply =
        data.content
          ?.filter((b) => b.type === "text")
          .map((b) => b.text)
          .join("\n") || "申し訳ございません、うまく応答できませんでした。";

      setMessages((prev) => [...prev, { role: "assistant", content: reply }]);

      // ★Notionに会話を記録（名前・年代も一緒に送る。失敗してもチャットには影響しない）

        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: guestName || "ゲスト",
          age: guestAge || "",
          pageId: notionPageIdRef.current,
          userMessage: trimmed,
          assistantMessage: reply,
          turnCount: newMessages.filter((m) => m.role === "user").length,

        .then((d) => { if (d && d.pageId) notionPageIdRef.current = d.pageId; })

      setCurrentQuestions(pickQuestions(newUsed, 6));

  const handleKeyDown = (e) => {

const renderLinks = (text) => {
    const mdRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const parts = [];
    let last = 0;
    let match;
    const temp = text;
    while ((match = mdRegex.exec(temp)) !== null) {
      if (match.index > last) parts.push(temp.slice(last, match.index));
      parts.push(<a key={match.index} href={match[2]} target="_blank" rel="noopener noreferrer" style={{color:"#8b6f4e",textDecoration:"underline"}}>{match[1]}</a>);
      last = match.index + match[0].length;
    }
    if (last === 0) {
      let m2;
      while ((m2 = urlRegex.exec(temp)) !== null) {
        if (m2.index > last) parts.push(temp.slice(last, m2.index));
        parts.push(<a key={m2.index} href={m2[0]} target="_blank" rel="noopener noreferrer" style={{color:"#8b6f4e",textDecoration:"underline"}}>{m2[0]}</a>);
        last = m2.index + m2[0].length;
      }
    }
    if (last < temp.length) parts.push(temp.slice(last));
    return parts.length > 0 ? parts : text;
  };
 const renderContent = (text) => {

))}

            <div style={styles.statusDot}>
              <span style={styles.dot}></span>
              <span style={styles.statusText}>Online</span>
            </div>
          </div>
        </div>

        {/* Messages */}
        <div style={styles.messagesArea}>
<div style={styles.dateLabel}>今日</div>

          {messages.map((msg, idx) => (
            <div
              key={idx}
              data-role={msg.role}
              style={
                msg.role === "user" ? styles.userBubbleRow : styles.botBubbleRow
              }
            >
              <div
                style={
                  msg.role === "user" ? styles.userBubble : styles.botBubble
                }
              >
                {msg.role === "user" ? (
                  <span style={styles.userBubbleText}>
                    {renderContent(msg.content)}
                  </span>
                ) : (
                  renderBotContent(msg.content)
                )}
              </div>
            </div>
          ))}

          {isLoading && (
            <div style={styles.botBubbleRow}>
              <div style={styles.botBubble}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <RenaAvatar size={42} />
                  <div style={styles.typing}>
                    <span style={styles.typingDot1}></span>
                    <span style={styles.typingDot2}></span>
                    <span style={styles.typingDot3}></span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showQuickQ && !isLoading && currentQuestions.length > 0 && (
            <div style={styles.quickQWrap} key={currentQuestions.join(",")}>
              <div style={styles.quickQLabel}>
                他にも気になることがあればタップしてください ♪
              </div>
              <div style={styles.quickQGrid}>
                {currentQuestions.map((q, i) => (
                  <button
                    key={q}
                    style={styles.quickQBtn}
                    onClick={() => sendMessage(q)}
                    onMouseEnter={(e) =>
                      (e.target.style.background =
                        "linear-gradient(135deg, #c9a87c 0%, #b8956a 100%)")
                    }
                    onMouseLeave={(e) =>
                      (e.target.style.background =
                        "linear-gradient(135deg, #d4b896 0%, #c9a87c 100%)")
                    }
                  >
                    {q}
                  </button>
                ))}
              </div>
              <div style={styles.quickQBooking}>
                <a
                  href={BOOKING_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={styles.quickQBookingLink}
                  onMouseEnter={(e) =>
                    (e.target.style.transform = "translateY(-1px)")
                  }
                  onMouseLeave={(e) =>
                    (e.target.style.transform = "translateY(0)")
                  }
                >
                  ネット予約はこちら ♪
                </a>
              </div>
            </div>
          )}

          {showBooking && (
            <div style={styles.bookingBanner}>
              <div style={styles.bookingInner}>
                <div style={styles.bookingText}>
                  ✨ あなたに合ったケアをご提案いたします
                </div>
                <a
                  href={BOOKING_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={styles.bookingBtn}
                  onMouseEnter={(e) =>
                    (e.target.style.transform = "translateY(-1px)")
                  }
                  onMouseLeave={(e) =>
                    (e.target.style.transform = "translateY(0)")
                  }
                >
                  ネット予約はこちら ♪
                </a>
              </div>
            </div>
          )}

          <div ref={messagesEndRef} />
        </div>

        {/* Input */}
        <div style={styles.inputArea}>
          <div style={styles.inputRow}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="気になることをご記入ください…"
              style={styles.textarea}
              rows={1}
            />
            <button
              onClick={() => sendMessage(input)}
              disabled={isLoading || !input.trim()}
              style={{
                ...styles.sendBtn,
                opacity: isLoading || !input.trim() ? 0.4 : 1,
              }}
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path
                  d="M22 2L11 13"
                  stroke="white"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
                <path
                  d="M22 2L15 22L11 13L2 9L22 2Z"
                  stroke="white"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
            </button>
          </div>
          <div style={styles.footerNote}>
            Moulin-R Beauty Counselor powered by AI
          </div>
        </div>
      </div>

      <style>{`
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
        }
        @keyframes shimmer {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        @keyframes gentleFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-3px); }
        }
        textarea::placeholder {
          color: #b8a898;
          font-family: 'Noto Sans JP', sans-serif;
          font-weight: 300;
        }
        textarea:focus {
          outline: none;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4c4b0; border-radius: 2px; }
      `}</style>
    </div>
  );
}
