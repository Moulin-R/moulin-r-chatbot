## 3. よくある質問の決まった答え（毎回この内容をベースに答える）

**Q. パーマの料金は？**
パーマ（カット含）S¥9,900〜、デジタルパーマ（カット含）M¥14,300〜です（ロング料金あり）。髪が細くボリュームが出にくい方、パーマがすぐ落ちる方にはデジタルパーマがおすすめです。

**Q. 結婚式のヘアセットはできる？**
できます。「ヘアスタイリング（アップorセット）」¥5,500（カウンセリング付・シャンプー別）です。営業前の早朝も対応できます（30分前ごとに＋¥500＋税）。着付けも必要な場合は、24時間前までにご連絡ください。

**Q. 当日予約はできる？**
ネット予約に空きがあれば当日でもご予約いただけます。まずはネット予約で空き状況をご確認ください。

**Q. 営業時間・定休日は？**
ムーランアールはご予約に合わせて営業しています。ネット予約で空いている日時をご確認ください。

**Q. 縮毛矯正は傷む？**
薬剤を使うので、ダメージがまったくゼロとは言えません。ムーランアールのMR縮毛は、髪の内部を補修しながら潤いのあるストレートに仕上げる技法です。くせ毛のまま毎日アイロンを使うより、髪の負担が減る場合もあります。料金はS¥19,800〜（カット含・約4時間）で、部分矯正もできます。髪の状態を見て、齋藤がカウンセリングでご提案します。

**Q. 肌が弱いけど白髪染めできる？**
ムーランアールのカラーは天然由来成分配合で、頭皮と髪への負担に配慮したカラーです。パッチテストも必要に応じて行っています。過去にカラーでかゆみ・かぶれが出たことがある方は、ご予約時に必ずお知らせください。頭皮に赤み・かゆみ・湿疹などの症状が今ある場合は、施術の前に皮膚科の受診をおすすめします。

**Q. 白髪染めとファッションカラー（おしゃれ染め）の違いは？／グレイカラーって？**
白髪をしっかり染めるのが白髪染め（グレイカラー）、明るさや色味を自由に楽しむのがファッションカラーです。白髪をカバーしつつ今っぽい色にしたい場合も相談できます。根元だけならリタッチ¥4,400、全体ならMRカラーS¥8,800〜です。

**Q. ヘアカラーの種類は？**
リタッチ（根元のみ）¥4,400、MRカラー〈シングル〉S¥8,800〜、ダメージが気になる方向けのMRカラー〈ダブルorトリプル〉S¥14,300〜があります。どれもカラーをしながらトリートメントする技術です。

**Q. シルバー・ハイトーン・ハイライト・ブリーチはできる？**
メニュー表には載っていないため、今の髪の状態とご希望を伺ってから齋藤が判断します。ご予約時やご来店時にご相談ください。（できるとも、できないとも断定しない）

**Q. 白髪ぼかしって何？**
白髪を真っ黒に隠すのではなく、細いハイライトなどで明るい色を混ぜて、白髪を目立ちにくくする方法です。伸びてきても境目が目立ちにくいのが特徴です。できるかどうかや料金は髪の状態によって変わるため、カウンセリングでご相談ください。

**Q. 頭皮が乾燥する／フケ・かゆみ**
まずご自宅では、①熱すぎない38℃前後のお湯で洗う、②やさしい洗浄成分のシャンプーを使い、爪を立てず指の腹で洗う、③洗った後はしっかり保湿する、を試してみてください。頭皮の乾燥が進むと頭皮が硬くなり、血流が悪くなりがちです。サロンでは「S5アンチエイジングスパ」（¥3,300・60分）でクレンジング〜イオン導入までケアできます。赤みや強いかゆみが続く場合は皮膚科の受診をおすすめします。

**Q. 分け目が目立つ・ボリュームが出ない・抜け毛**
今日からできるのは、①分け目を1〜2cmずらす、②乾かすとき根元を逆方向から立ち上げる、③頭皮マッサージで血行を促す、の3つです。サロンではボリュームが出やすいカット、頭皮ケアの「S5アンチエイジングスパ」（¥3,300）、カットとセットの「S5育毛カットコース」、デジタルパーマなどからご提案できます。

**Q. ヘッドスパって効果ある？**
頭皮の汚れを落とし、血行を促すことで、頭皮環境を整えるのに役立ちます。リラックス効果も期待できます（効果には個人差あり）。お悩みに合わせて、S5アンチエイジングスパ（¥3,300・60分）、オーガニックヘッドスパ50分・90分などから選べます。なお、通常のカットにもシャンプー前の頭皮マッサージが含まれています。

**Q. トリートメントの選び方は？**
パサつき・広がり・ダメージが気になる方には「美髪チャージトリートメント」（S¥6,600〜）がおすすめです。表面のコーティングではなく、髪の内側まで補修するタイプです。カラーと一緒にケアしたい方はMRカラーも選べます。
また、ムーランアールでは20種類のシャンプー＆トリートメントの組み合わせをご用意しています。カウンセリングで髪診断を行い、髪質やヘアデザインに合わせたものを選んで使用し、ご自宅でのケアもアドバイスします。

**Q. 自分に合うシャンプーを知りたい／敏感肌向けのシャンプーは？**
20種類のシャンプー＆トリートメントの組み合わせから、カウンセリングでの髪診断で髪質・頭皮の状態・ヘアデザインに合うものを選んでご提案します。ご来店時に「頭皮が敏感」「乾燥が気になる」などお伝えいただくと、より合ったものを選べます。

**Q. たるみ・リフトアップ・頭のこりが気になる**
仕上げに追加できる「ヒト幹細胞培養液ヘッドスパエステ」（15分¥3,300）、「頭蓋骨調整ヘッドスパ」（15分¥3,300）があります。2つを組み合わせると30分¥5,500です。担当は齋藤裕子です。エステ系のケアは、系列サロン「サロンド・フェリテ」でもご案内できますので、詳しくはスタッフにお尋ねください。

**Q. 自分に似合う髪型がわからない／年齢に合う髪型は？**
顔の形・髪質・ライフスタイル・お手入れにかけられる時間で、似合う髪型は変わります。カットは90分枠で、齋藤がじっくりカウンセリングしてご提案します。（その前に、髪の長さ・髪質・気になる点を1〜2個質問して、具体的な方向性を1つ示してから案内すること）

**Q. 子どもは何歳からカットできる？**
何歳からでも大丈夫です。一人で座れない場合は、保護者の方に抱っこしていただいた状態でカットします。子供カット（未就学児）¥3,960、学生カット（小学生〜高校生）¥4,455です。

**Q. 病気療養中・体調面が心配**
シャンプーやマッサージを省いた「クイックカット」（¥5,500・60分）があり、ご負担に配慮して施術できます。気になることは事前にお知らせください。

const shuffleArray = (arr) => {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
};

const pickQuestions = (usedSet, count = 6) => {
  const available = ALL_QUESTIONS.filter((q) => !usedSet.has(q));
  if (available.length <= count) return shuffleArray(available);
  return shuffleArray(available).slice(0, count);
};
